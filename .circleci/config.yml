version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/workspace
    steps:
      - checkout
      - restore_cache:
          keys:
            - dependency-cache-v2-{{ .Branch }}-{{ checksum "package.json" }}
            - dependency-cache-v2-{{ .Branch }}
            - dependency-cache-v2-
      - run: npm install
      - save_cache:
          key: dependency-cache-v2-{{ .Branch }}-{{ checksum "package.json" }}
          paths:
            - ./node_modules
      - run:
          name: lint
          command: npm run lint
